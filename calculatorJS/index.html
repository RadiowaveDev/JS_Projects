<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
    <title>CalculatorJS</title>
    <script src="/Calculator.js" type="text/javascript"></script>
    <script src="/Display.js" type="text/javascript"></script>
</head>
<body>
    <main>
        <div class="container">
            <div class="calculator">
                <div class="display">
                    <div id="previous-value"></div>
                    <div id="current-value"></div>
                </div>
                <button class="col-2" onclick="display.eraseAll()">C</button>
                <button onclick="display.erase()">&larr;</button>
                <button class="operator" value="divide">/</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator" value="multiply">*</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator" value="subtract">-</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator" value="add">+</button>
                <button class="number col-2">0</button>
                <button class="number">.</button>
                <button class="operator" value="equal">=</button>
            </div>
        </div>
    </main>
    <script src="/script.js"></script>
</body>
</html>
